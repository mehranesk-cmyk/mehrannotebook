<!DOCTYPE html>
<html lang="fa" dir="rtl" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>دفتر یادداشت برداری مهران</title>

<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#7c5cff">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="دفتر مهران">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/vazirmatn@33.0.3/Vazirmatn-font-face.css">
<link rel="apple-touch-icon" href="icon-192.png">
<!--
  ================== نقشه پروژه (بخش ۱ + ۲ + ۳ : ۱۰۰٪) ==================
  [✓] بخش ۱:
      - ساختار کلی محیط مثل M1 (سایدبار راست "اسناد" + ادیتور)
      - تم تاریک / روشن (ذخیره در حافظه)
      - دیتابیس IndexedDB + درخواست ذخیره دائمی (حذف نشدن داده‌ها)
      - درخت فولدر / زیرفولدر / یادداشت
      - سطل زباله نرم + ذخیره خودکار + نسخه پشتیبان خودکار
      - ادیتور بلوکی و منوی "/" (P1 تا P4)
  [✓] بخش ۲:
      - تولبار شناور انتخاب متن (P7, P8) با پالت رنگ متن و هایلایت
      - دستگیره و منوی بلوک (P5, P6): تبدیل به، رنگ، تکثیر، انتقال بالا/پایین، کپی پیوند بلوک، حذف
      - بلوک‌ها: جدول، چک‌لیست، بلوک بازشو، بنر هشدار/اطلاعات، Mermaid، Markdown، تصویر، ویدیو، صدا، پیوست، رسانه درون‌خطی
      - درون‌خطی: ایموجی، اشاره به شخص/وظیفه/صفحه، بج، پیوند
      - برچسب‌های یادداشت زیر عنوان (مثل M1)، پنل سطل زباله با بازگردانی
  [✓] بخش ۳:
      - فهرست مطالب بازشونده (TOC) شناور + بلوک "فهرست مطالب" داخل یادداشت
      - خروجی‌ها مثل K1: HTML, Markdown, PDF (فونت فارسی، مثل PDF1), Word (.docx), ODT, TXT
      - وارد کردن فایل (md/txt/html/docx/پشتیبان json) + کشیدن و رها کردن، جستجو، میانبرها
      - دکمه "✦ بهبود" = ویرایش نگارش فارسی (ی/ک، نیم‌فاصله، فاصله‌گذاری، گیومه)
      - منوی راست‌کلیک کامل سایدبار (تغییر نام، زیرفولدر، تکثیر، انتقال، خروجی)
      - PWA (نصب به‌شکل اپ + آفلاین + بروزرسانی خودکار) + همگام‌سازی ابری Supabase
  =========================================================================
-->
<style>
:root{
  --font:'Vazirmatn',Tahoma,sans-serif;
  --radius:8px;
}
[data-theme="dark"]{
  --bg:#0f0f10; --panel:#141416; --panel2:#1b1b1f; --border:#26262b;
  --text:#e9e9ec; --muted:#8b8b95; --accent:#7c5cff; --hover:#202026;
  --code-bg:#1f1f24; --hl-yellow:#fde68a;
}
[data-theme="light"]{
  --bg:#ffffff; --panel:#f7f7f8; --panel2:#efeff2; --border:#e3e3e8;
  --text:#1b1b1f; --muted:#6b6b76; --accent:#6d4aff; --hover:#ececf1;
  --code-bg:#f1f1f4; --hl-yellow:#fde68a;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);color:var(--text);font-family:var(--font)}
button{font-family:inherit;color:inherit;background:none;border:0;cursor:pointer}

/* ===== Layout (M1) ===== */
.app{display:flex;height:100vh;overflow:hidden}
.sidebar{width:290px;min-width:220px;background:var(--panel);border-left:1px solid var(--border);display:flex;flex-direction:column}
.sidebar.collapsed{display:none}
.sb-head{display:flex;align-items:center;justify-content:space-between;padding:12px 14px;border-bottom:1px solid var(--border)}
.sb-title{font-weight:700;font-size:15px}
.sb-actions{display:flex;gap:4px}
.icon-btn{width:28px;height:28px;border-radius:6px;display:grid;place-items:center;color:var(--muted)}
.icon-btn:hover{background:var(--hover);color:var(--text)}
.tree{flex:1;overflow:auto;padding:8px 6px}
.node{display:flex;align-items:center;gap:6px;padding:6px 8px;border-radius:6px;font-size:14px;cursor:pointer;user-select:none}
.node:hover{background:var(--hover)}
.node.active{background:var(--panel2)}
.node .caret{width:14px;color:var(--muted);transition:transform .15s}
.node.open .caret{transform:rotate(-90deg)}
.node .name{flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.node .count{color:var(--accent);font-size:12px}
.children{padding-right:16px;border-right:1px solid var(--border);margin-right:14px}
.children.hidden{display:none}
.sb-foot{padding:8px;border-top:1px solid var(--border);display:flex;justify-content:space-between;font-size:12px;color:var(--muted)}

.main{flex:1;overflow:auto;position:relative}
.topbar{position:sticky;top:0;z-index:5;display:flex;justify-content:space-between;align-items:center;padding:8px 16px;background:var(--bg);border-bottom:1px solid var(--border)}
.save-state{font-size:12px;color:var(--muted)}
.doc{max-width:900px;margin:0 auto;padding:30px 40px 200px}
.doc-title{font-size:30px;font-weight:800;outline:none;margin:10px 0 6px}
.doc-title:empty:before{content:'بدون عنوان';color:var(--muted)}
.tags{display:flex;gap:6px;margin-bottom:14px;flex-wrap:wrap}
.tag{font-size:12px;padding:2px 10px;border-radius:6px;border:1px solid var(--border)}

/* ===== Editor blocks ===== */
.editor{outline:none;line-height:1.95;font-size:16px}
.editor h1{font-size:26px;margin:14px 0 4px}
.editor h2{font-size:22px;margin:12px 0 4px}
.editor h3{font-size:19px;margin:10px 0 4px}
.editor h4{font-size:17px;margin:8px 0 4px}
.editor code{background:var(--code-bg);padding:1px 6px;border-radius:5px;font-family:Consolas,monospace;direction:ltr;unicode-bidi:embed}
.editor pre{background:var(--code-bg);padding:14px;border-radius:var(--radius);direction:ltr;text-align:left;overflow:auto}
.editor blockquote{border-right:3px solid var(--accent);margin:6px 0;padding:4px 12px;color:var(--muted)}
.editor mark{background:var(--hl-yellow);color:#111;padding:0 4px;border-radius:4px}
.editor hr{border:0;border-top:1px solid var(--border);margin:16px 0}

/* ===== Slash menu (P1–P4) ===== */
.slash{position:fixed;z-index:50;width:400px;max-height:380px;overflow:auto;background:var(--panel);border:1px solid var(--border);border-radius:10px;box-shadow:0 10px 30px #0006;padding:6px;display:none}
.slash.show{display:block}
.slash .grp{font-size:12px;color:var(--muted);padding:8px 8px 4px}
.slash .grid{display:grid;grid-template-columns:1fr 1fr;gap:2px}
.slash .item{display:flex;align-items:center;gap:8px;padding:7px 8px;border-radius:6px;font-size:14px;cursor:pointer}
.slash .item:hover,.slash .item.sel{background:var(--hover)}
.slash .ic{width:24px;height:24px;border-radius:6px;display:grid;place-items:center;font-size:11px;background:var(--panel2)}

/* ===== Modal ===== */
.modal-bg{position:fixed;inset:0;background:#0007;display:none;place-items:center;z-index:100}
.modal-bg.show{display:grid}
.modal{background:var(--panel);border:1px solid var(--border);border-radius:12px;padding:18px;width:340px}
.modal input{width:100%;padding:9px 10px;border-radius:8px;border:1px solid var(--border);background:var(--bg);color:var(--text);font-family:inherit;margin:10px 0}
.modal .row{display:flex;gap:8px;justify-content:flex-start}
.btn{padding:7px 14px;border-radius:8px;background:var(--panel2)}
.btn.primary{background:var(--accent);color:#fff}
/* ================= بخش ۲ : CSS ================= */
/* تولبار شناور (P7/P8) */
.ftb{position:fixed;z-index:60;display:none;align-items:center;gap:2px;background:var(--panel);border:1px solid var(--border);border-radius:10px;padding:4px 6px;box-shadow:0 8px 24px #0006}
.ftb.show{display:flex}
.ftb button{min-width:28px;height:28px;border-radius:6px;font-size:13px;color:var(--muted);padding:0 6px}
.ftb button:hover,.ftb button.on{background:var(--hover);color:var(--text)}
.ftb .sep{width:1px;height:18px;background:var(--border);margin:0 3px}
.ftb .ai{color:#c084fc;font-weight:700}
.palette{position:fixed;z-index:61;display:none;grid-template-columns:repeat(5,32px);gap:6px;padding:10px;background:var(--panel);border:1px solid var(--border);border-radius:10px}
.palette.show{display:grid}
.palette .sw{width:32px;height:28px;border-radius:7px;border:1px solid var(--border);cursor:pointer;display:grid;place-items:center;font-weight:700}
/* دستگیره و منوی بلوک (P5/P6) */
.bhandle{position:fixed;z-index:40;display:none;gap:2px;color:var(--muted)}
.bhandle.show{display:flex}
.bhandle span{width:20px;height:22px;display:grid;place-items:center;border-radius:5px;cursor:pointer}
.bhandle span:hover{background:var(--hover);color:var(--text)}
.ctx{position:fixed;z-index:70;display:none;min-width:210px;background:var(--panel);border:1px solid var(--border);border-radius:10px;padding:6px;box-shadow:0 10px 30px #0007}
.ctx.show{display:block}
.ctx .mi{display:flex;align-items:center;gap:10px;padding:7px 10px;border-radius:6px;font-size:14px;cursor:pointer;position:relative}
.ctx .mi:hover{background:var(--hover)}
.ctx .mi .k{margin-right:auto;color:var(--muted)}
.ctx .mi.danger{color:#ef4444}
.ctx hr{border:0;border-top:1px solid var(--border);margin:4px 0}
.ctx .ttl{font-size:12px;color:var(--muted);padding:6px 8px}
.ctx .cgrid{display:grid;grid-template-columns:repeat(3,56px);gap:6px;padding:4px 8px 8px}
.ctx .cgrid div{height:30px;border-radius:7px;border:1px solid var(--border);display:grid;place-items:center;cursor:pointer;font-weight:700}
.sub{position:absolute;top:-6px;right:100%;margin-right:6px}
/* بلوک‌ها */
.editor table{border-collapse:collapse;width:100%;margin:8px 0}
.editor td,.editor th{border:1px solid var(--border);padding:6px 10px;min-width:60px}
.editor th{background:var(--panel2)}
.editor ul.checklist{list-style:none;padding-right:4px}
.editor ul.checklist li{display:flex;gap:8px;align-items:baseline}
.editor ul.checklist .cb{width:16px;height:16px;border:1.5px solid var(--muted);border-radius:4px;flex:none;cursor:pointer;position:relative;top:3px}
.editor ul.checklist li[data-done="1"] .cb{background:#22c55e;border-color:#22c55e}
.editor ul.checklist li[data-done="1"] .cb:after{content:'✓';color:#fff;font-size:11px;position:absolute;inset:0;display:grid;place-items:center}
.editor ul.checklist li[data-done="1"] .tx{text-decoration:line-through;color:var(--muted)}
.editor details{border:1px solid var(--border);border-radius:8px;padding:6px 12px;margin:6px 0}
.editor summary{cursor:pointer;font-weight:700}
.editor .callout{display:flex;gap:10px;padding:10px 14px;border-radius:8px;margin:6px 0}
.editor .callout.warn{background:#f59e0b22;border-right:3px solid #f59e0b}
.editor .callout.info{background:#3b82f622;border-right:3px solid #3b82f6}
.editor .mm,.editor .mdb{border:1px dashed var(--border);border-radius:8px;padding:8px;margin:6px 0}
.editor .mm pre,.editor .mdb pre{margin:0 0 6px}
.editor .mm .out{direction:ltr;text-align:center}
.editor img,.editor video{max-width:100%;border-radius:8px}
.editor audio{width:100%}
.editor .att{display:inline-flex;gap:6px;padding:6px 12px;border:1px solid var(--border);border-radius:8px;text-decoration:none;color:var(--text)}
.editor .badge{display:inline-block;font-size:12px;padding:1px 10px;border-radius:6px;border:1px solid currentColor}
.editor .mention,.editor .taskref,.editor .pagelink{background:var(--panel2);padding:1px 6px;border-radius:5px;color:var(--accent);text-decoration:none;cursor:pointer}
.editor .flash{animation:flash 1.2s}
@keyframes flash{0%{background:#7c5cff44}100%{background:transparent}}
.emo{position:fixed;z-index:70;display:none;grid-template-columns:repeat(8,32px);gap:2px;padding:8px;background:var(--panel);border:1px solid var(--border);border-radius:10px}
.emo.show{display:grid}
.emo span{font-size:20px;cursor:pointer;text-align:center;border-radius:6px}
.emo span:hover{background:var(--hover)}
.tag{cursor:pointer}
.tag.add{border-style:dashed;color:var(--muted)}
.trash-list{max-height:320px;overflow:auto;margin:10px 0}
.trash-list .ti{display:flex;align-items:center;gap:6px;padding:6px;border-bottom:1px solid var(--border);font-size:13px}
.trash-list .ti span{flex:1}

/* ================= بخش ۳ : CSS ================= */
.editor h1,.editor h2,.editor h3,.editor h4{scroll-margin-top:70px}
.editor ol{list-style-type:persian}
.topbar .wide{width:auto;padding:0 10px;font-size:13px}
.tb-right{display:flex;align-items:center;gap:12px}
.sync-state{font-size:12px;color:var(--muted);cursor:pointer;white-space:nowrap}
.sync-state.ok{color:#22c55e}.sync-state.err{color:#ef4444}.sync-state.busy{color:var(--accent)}
/* فهرست مطالب شناور */
.toc-panel{position:fixed;top:58px;left:18px;width:270px;max-height:calc(100vh - 80px);overflow:auto;background:var(--panel);border:1px solid var(--border);border-radius:12px;padding:8px;z-index:30;box-shadow:0 12px 34px #0005;display:none}
.toc-panel.show{display:block}
.toc-head{display:flex;justify-content:space-between;align-items:center;font-weight:700;font-size:14px;padding:2px 6px 8px;border-bottom:1px solid var(--border);margin-bottom:6px}
.toc-head .icon-btn{display:inline-grid}
.toc-item{display:flex;align-items:center;gap:4px;padding:5px 6px;border-radius:6px;font-size:14px;cursor:pointer;color:var(--muted);line-height:1.5}
.toc-item:hover{background:var(--hover);color:var(--text)}
.toc-item.active{color:var(--text);background:var(--panel2);box-shadow:inset -2px 0 0 var(--accent)}
.toc-item.lv1{font-weight:700;color:var(--text)}
.toc-item .tc{width:18px;flex:none;text-align:center;transition:transform .15s;font-size:12px}
.toc-item .tt{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.toc-node.closed>.toc-item .tc{transform:rotate(90deg)}
.toc-node.closed>.toc-kids{display:none}
.toc-kids{padding-right:10px;border-right:1px solid var(--border);margin-right:9px}
.toc-empty{color:var(--muted);font-size:14px;padding:6px;margin:0;line-height:1.8}
/* بلوک فهرست مطالب داخل یادداشت */
.editor .tocb{border:1px solid var(--border);border-radius:10px;padding:8px 14px;margin:8px 0;background:var(--panel);user-select:none}
.editor .tocb details{border:0;padding:0;margin:0}
.editor .tocb summary{font-weight:400;padding:2px 0}
.editor .tocb .tocroot>summary{font-weight:700}
.editor .tocb .tk{padding-right:18px}
.editor .tocb .tl{padding:2px 18px 2px 0}
.editor .tocb a{color:var(--accent);cursor:pointer;text-decoration:none}
.editor .tocb a:hover{text-decoration:underline}
/* منوی خروجی (K1) */
.xmenu{position:fixed;z-index:80;display:none;width:280px;background:var(--panel);border:1px solid var(--border);border-radius:12px;padding:6px;box-shadow:0 14px 40px #0008}
.xmenu.show{display:block}
.xmenu .xi{display:flex;align-items:center;gap:12px;padding:8px 10px;border-radius:8px;cursor:pointer}
.xmenu .xi:hover{background:var(--hover)}
.xmenu .xi svg{width:20px;height:20px;flex:none}
.xmenu .xi b{display:block;font-size:14px;line-height:1.5}
.xmenu .xi small{display:block;font-size:13px;color:var(--muted);line-height:1.5}
.xmenu .xh{font-size:12px;color:var(--muted);padding:6px 10px 2px}
/* جستجو */
.search-modal{width:min(620px,94vw)!important;padding:12px!important}
.search-modal input{margin:0 0 8px!important;font-size:15px}
.sres{max-height:60vh;overflow:auto}
.sr{padding:8px 10px;border-radius:8px;cursor:pointer}
.sr:hover,.sr.sel{background:var(--hover)}
.sr .st{font-weight:700;font-size:14px}
.sr .sp{font-size:12px;color:var(--muted)}
.sr .ss{font-size:13px;color:var(--muted);line-height:1.8;margin-top:2px}
.sr mark{background:var(--hl-yellow);color:#111;border-radius:3px;padding:0 2px}
/* همگام‌سازی و میانبرها */
.sync-modal{width:min(520px,94vw)!important}
.sync-modal label{display:block;font-size:13px;color:var(--muted);margin-top:8px}
.sync-modal input{margin:4px 0 0!important}
.sync-modal .row{margin-top:14px;flex-wrap:wrap}
.sync-modal details{margin-top:12px;font-size:13px}
.sync-modal pre{direction:ltr;text-align:left;background:var(--code-bg);padding:10px;border-radius:8px;font-size:12px;max-height:200px;overflow:auto;white-space:pre-wrap}
.sync-modal .hint{font-size:13px;color:var(--muted);line-height:1.8;margin:6px 0 0}
.keys{display:grid;grid-template-columns:1fr auto;gap:6px 18px;font-size:14px;margin:10px 0}
.keys kbd{direction:ltr;font-family:Consolas,monospace;background:var(--panel2);border:1px solid var(--border);border-bottom-width:2px;border-radius:6px;padding:1px 7px;font-size:12px}
/* اعلان */
.toast{position:fixed;bottom:22px;left:50%;transform:translate(-50%,20px);background:var(--panel2);color:var(--text);border:1px solid var(--border);padding:10px 16px;border-radius:10px;font-size:14px;z-index:200;opacity:0;pointer-events:none;transition:.25s;box-shadow:0 10px 30px #0006;display:flex;gap:10px;align-items:center}
.toast.show{opacity:1;transform:translate(-50%,0);pointer-events:auto}
.drop-hint{outline:2px dashed var(--accent);outline-offset:-6px}
/* موبایل */
@media (max-width:800px){
  .sidebar{position:fixed;top:0;bottom:0;right:0;z-index:90;box-shadow:-10px 0 30px #0006}
  .doc{padding:20px 16px 160px}
  .toc-panel{left:10px;right:10px;width:auto}
  .slash{width:calc(100vw - 20px)}
}
@media print{.sidebar,.topbar,.toc-panel,.bhandle{display:none!important}}
</style>
</head>
<body>
<div class="app">
  <aside class="sidebar" id="sidebar">
    <div class="sb-head">
      <span class="sb-title">اسناد</span>
      <div class="sb-actions">
        <button class="icon-btn" title="برچسب‌ها" id="btnTags">🏷</button>
        <button class="icon-btn" title="یادداشت جدید" id="btnNewNote">📄</button>
        <button class="icon-btn" title="فولدر جدید" id="btnNewFolder">📁</button>
        <button class="icon-btn" title="وارد کردن فایل" id="btnImport">⬆</button>
        <button class="icon-btn" title="بستن سایدبار" id="btnToggleSb">◧</button>
      </div>
    </div>
    <div class="tree" id="tree"></div>
    <div class="sb-foot">
      <button id="btnTrash">🗑 سطل زباله</button>
      <button id="btnBackup">💾 پشتیبان</button>
      <button id="btnVault">📂 پوشهٔ دفتر</button>
    </div>
  </aside>

  <main class="main">
    <div class="topbar">
      <div style="display:flex;gap:6px">
        <button class="icon-btn" id="btnTheme" title="تاریک / روشن">🌙</button>
        <button class="icon-btn" id="btnExport" title="خروجی">⤓</button>
        <button class="icon-btn" id="btnToc" title="فهرست مطالب">☰</button>
      </div>
      <span class="save-state" id="saveState">ذخیره شد</span>
    </div>
    <div class="doc" id="doc">
      <div class="doc-title" id="docTitle" contenteditable="true"></div>
      <div class="tags" id="docTags"></div>
      <div class="editor" id="editor" contenteditable="true"></div>
    </div>
  </main>
</div>

<div class="slash" id="slash"></div>

<div class="modal-bg" id="modalBg">
  <div class="modal">
    <div id="modalTitle">نام</div>
    <input id="modalInput">
    <div class="row">
      <button class="btn primary" id="modalOk">تایید</button>
      <button class="btn" id="modalCancel">انصراف</button>
    </div>
  </div>
</div>
<!-- ================= بخش ۲ : HTML ================= -->
<div class="ftb" id="ftb">
  <button data-c="clear" title="پاک کردن قالب">T̸</button>
  <button data-c="badge" title="برچسب">🏷</button>
  <button data-c="hlpal" title="هایلایت">🖍</button>
  <button data-c="colpal" title="رنگ متن">T</button>
  <span class="sep"></span>
  <button data-c="h4">H4</button><button data-c="h3">H3</button><button data-c="h2">H2</button><button data-c="h1">H1</button>
  <span class="sep"></span>
  <button data-c="link" title="پیوند">🔗</button>
  <button data-c="inlinecode" title="کد">&lt;&gt;</button>
  <button data-c="strike" title="خط خورده"><s>S</s></button>
  <button data-c="underline" title="زیرخط"><u>U</u></button>
  <button data-c="italic" title="مورب"><i>I</i></button>
  <button data-c="bold" title="ضخیم"><b>B</b></button>
  <span class="sep"></span>
  <button data-c="check" title="چک‌لیست">☑</button>
  <button data-c="ai" class="ai" title="بهبود نگارش">✦ بهبود</button>
</div>
<div class="palette" id="palette"></div>
<div class="bhandle" id="bhandle"><span id="bhPlus" title="افزودن بلوک">+</span><span id="bhDrag" title="منوی بلوک">⠿</span></div>
<div class="ctx" id="ctx"></div>
<div class="emo" id="emo"></div>
<input type="file" id="filePick" hidden>
<div class="modal-bg" id="trashBg"><div class="modal" style="width:420px">
  <b>🗑 سطل زباله</b><div class="trash-list" id="trashList"></div>
  <div class="row"><button class="btn" id="trashClose">بستن</button></div>
</div></div>


<script>
/* ===================== 1) DATABASE : IndexedDB ===================== */
const DB_NAME='mehran-notebook', DB_VER=1;
let db;
function openDB(){
  return new Promise((res,rej)=>{
    const r=indexedDB.open(DB_NAME,DB_VER);
    r.onupgradeneeded=e=>{
      const d=e.target.result;
      if(!d.objectStoreNames.contains('nodes')){
        const s=d.createObjectStore('nodes',{keyPath:'id'});
        s.createIndex('parent','parentId');
      }
      if(!d.objectStoreNames.contains('backups')) d.createObjectStore('backups',{keyPath:'ts'});
      if(!d.objectStoreNames.contains('meta')) d.createObjectStore('meta',{keyPath:'key'});
    };
    r.onsuccess=()=>{db=r.result;res(db)};
    r.onerror=()=>rej(r.error);
  });
}
const tx=(store,mode='readonly')=>db.transaction(store,mode).objectStore(store);
const dbAll=store=>new Promise(r=>{const q=tx(store).getAll();q.onsuccess=()=>r(q.result)});
const dbGet=(store,k)=>new Promise(r=>{const q=tx(store).get(k);q.onsuccess=()=>r(q.result)});
const dbPut=(store,v)=>new Promise(r=>{const q=tx(store,'readwrite').put(v);q.onsuccess=()=>r(v)});
const dbDel=(store,k)=>new Promise(r=>{const q=tx(store,'readwrite').delete(k);q.onsuccess=()=>r()});

async function requestPersistence(){
  if(navigator.storage && navigator.storage.persist){
    const ok=await navigator.storage.persisted() || await navigator.storage.persist();
    console.log('Persistent storage:',ok);
  }
}

/* ===================== 2) STATE & MODEL ===================== */
const state={nodes:[],activeId:null,theme:localStorage.getItem('mn-theme')||'dark'};
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,7);
const now=()=>Date.now();

async function loadAll(){ state.nodes=await dbAll('nodes'); }
function childrenOf(pid){
  return state.nodes.filter(n=>n.parentId===pid && !n.deleted)
    .sort((a,b)=>(a.type===b.type?0:a.type==='folder'?-1:1)||(a.order-b.order)||a.name.localeCompare(b.name,'fa'));
}
async function createNode(type,name,parentId=null){
  const n={id:uid(),type,parentId,name,content:'',tags:[],open:true,deleted:false,
           createdAt:now(),updatedAt:now(),order:childrenOf(parentId).length};
  state.nodes.push(n); await dbPut('nodes',n); return n;
}
async function updateNode(id,patch){
  const n=state.nodes.find(x=>x.id===id); if(!n) return;
  Object.assign(n,patch,{updatedAt:now()}); await dbPut('nodes',n);
}
async function softDelete(id){
  if(!confirm('بره تو سطل زباله؟ (قابل بازگردانیه)')) return;
  const mark=async nid=>{ await updateNode(nid,{deleted:true,deletedAt:now()}); for(const c of state.nodes.filter(x=>x.parentId===nid)) await mark(c.id); };
  await mark(id); if(state.activeId===id) state.activeId=null; renderTree(); openNote(null);
}

/* ===================== 3) AUTO BACKUP ===================== */
let lastBk='';
async function makeBackup(){
  if(!state.nodes.length) return;               // هیچ‌وقت پشتیبانِ «خالی» نساز
  const data=JSON.stringify(state.nodes); if(data===lastBk) return; lastBk=data;   // بدون تغییر = پشتیبان تازه نساز
  await dbPut('backups',{ts:now(),data});
  const all=await dbAll('backups');
  if(all.length>30){ const s=tx('backups','readwrite'); all.sort((a,b)=>a.ts-b.ts).slice(0,all.length-30).forEach(b=>s.delete(b.ts)); }
}
function downloadBackup(){
  const blob=new Blob([JSON.stringify(state.nodes,null,2)],{type:'application/json'});
  const a=document.createElement('a'); a.href=URL.createObjectURL(blob);
  a.download='mehran-notebook-backup-'+new Date().toISOString().slice(0,10)+'.json'; a.click();
}

/* ===================== 4) THEME ===================== */
function applyTheme(){
  document.documentElement.dataset.theme=state.theme;
  document.getElementById('btnTheme').textContent=state.theme==='dark'?'☀️':'🌙';
  localStorage.setItem('mn-theme',state.theme);
}

/* ===================== 5) SIDEBAR TREE ===================== */
const $tree=document.getElementById('tree');
function countNotes(id){ return childrenOf(id).reduce((s,c)=>s+(c.type==='note'?1:countNotes(c.id)),0); }
function renderTree(){ $tree.innerHTML=''; $tree.appendChild(buildLevel(null)); }
function buildLevel(pid){
  const wrap=document.createElement('div');
  for(const n of childrenOf(pid)){
    const row=document.createElement('div');
    row.className='node'+(n.open?' open':'')+(n.id===state.activeId?' active':'');
    row.innerHTML=`<span class="caret">${n.type==='folder'?'◂':''}</span>
      <span>${n.type==='folder'?'📁':'📄'}</span>
      <span class="name">${escapeHtml(n.name)}</span>
      ${n.type==='folder'?`<span class="count">${countNotes(n.id)}</span>`:''}`;
    row.onclick=async()=>{
      if(n.type==='folder'){ await updateNode(n.id,{open:!n.open}); state.folderCtx=n.id; renderTree(); }
      else openNote(n.id);
    };
    row.oncontextmenu=e=>{ e.preventDefault(); nodeMenu(n); };
    wrap.appendChild(row);
    if(n.type==='folder'){
      const ch=buildLevel(n.id); ch.className='children'+(n.open?'':' hidden'); wrap.appendChild(ch);
    }
  }
  return wrap;
}
async function nodeMenu(n){
  const act=prompt('1: تغییر نام\n2: زیرفولدر جدید\n3: یادداشت جدید داخلش\n4: سطل زباله','1');
  if(act==='1'){ const v=await ask('نام جدید',n.name); if(v){await updateNode(n.id,{name:v});renderTree();} }
  if(act==='2' && n.type==='folder'){ const v=await ask('نام زیرفولدر'); if(v){await createNode('folder',v,n.id);renderTree();} }
  if(act==='3' && n.type==='folder'){ const v=await ask('عنوان یادداشت'); if(v){const x=await createNode('note',v,n.id);renderTree();openNote(x.id);} }
  if(act==='4') softDelete(n.id);
}

/* ===================== 6) EDITOR + AUTOSAVE ===================== */
const $editor=document.getElementById('editor'), $title=document.getElementById('docTitle'), $save=document.getElementById('saveState');
let saveTimer;
function openNote(id){
  if(dirtyId&&dirtyId!==id) flushSave();
  state.activeId=id; const n=state.nodes.find(x=>x.id===id);
  $title.textContent=n?n.name:''; $editor.innerHTML=n?(n.content||'<p><br></p>'):'<p style="color:var(--muted)">یه یادداشت انتخاب کن یا بساز ✍️</p>';
  $editor.contentEditable=$title.contentEditable=!!n;
  renderTags();
  localStorage.setItem('mn-last',id||''); renderTree();
}
let dirtyId=null;
async function flushSave(){
  clearTimeout(saveTimer); if(!dirtyId) return; const id=dirtyId; dirtyId=null;
  const n=state.nodes.find(x=>x.id===id); if(!n||n.deleted) return;
  await updateNode(id,{name:$title.textContent.trim()||'بدون عنوان',content:$editor.innerHTML});
  $save.textContent='ذخیره شد ✓'; renderTree();
}
function scheduleSave(){
  if(!state.activeId) return; dirtyId=state.activeId;
  $save.textContent='در حال ذخیره...'; clearTimeout(saveTimer);
  saveTimer=setTimeout(flushSave,600);
}
$editor.addEventListener('input',scheduleSave);
$title.addEventListener('input',scheduleSave);
window.addEventListener('beforeunload',()=>{ flushSave(); });
window.addEventListener('pagehide',()=>{ flushSave(); });
document.addEventListener('visibilitychange',()=>{ if(document.hidden) flushSave(); });

/* ===================== 7) SLASH MENU ===================== */
const SLASH_GROUPS=[
  {g:'اخیراً استفاده شده',items:[['divider','—','جداکننده'],['codeblock','<>','بلوک کد'],['inlinecode','<>','کد درون‌خطی'],['ul','≡','لیست نقطه‌ای'],['toggle','▤','لیست بازشو'],['p','¶','متن ساده']]},
  {g:'پرکاربرد',items:[['center','≡','وسط‌چین'],['right','≡','راست‌چین'],['warn','⚠','بنر هشدار'],['quote','❝','بلوک نقل قول'],['h1','H1','عنوان ۱'],['table','▦','جدول']]},
  {g:'متن',items:[['h2','H2','عنوان ۲'],['h3','H3','عنوان ۳'],['h4','H4','عنوان ۴'],['ol','1.','لیست شماره‌دار'],['check','☑','چک‌لیست']]},
  {g:'درون‌خطی',items:[['emoji','☺','ایموجی'],['mention','@','اشاره به شخص'],['task','☑','اشاره به وظیفه'],['pagelink','🔗','اشاره به صفحه']]},
  {g:'قالب‌بندی',items:[['bold','T','متن ضخیم'],['italic','T','متن مورب'],['underline','U','زیرخط'],['strike','S','خط خورده'],['link','🔗','پیوند'],['color','T','رنگ متن'],['highlight','🖍','هایلایت'],['badge','🏷','بج'],['clear','—','پاک کردن قالب'],['left','≡','چپ‌چین']]},
  {g:'رسانه',items:[['embed','▶','رسانه درون‌خطی'],['video','🎬','ویدیو'],['audio','🎧','صدا']]},
  {g:'افزودن',items:[['import','⬆','وارد کردن فایل']]},
  {g:'بلوک‌ها',items:[['info','ℹ','بنر اطلاعات'],['markdown','<>','بلوک Markdown'],['mermaid','◫','دیاگرام Mermaid'],['image','🖼','تصویر'],['file','📎','پیوست فایل'],['toc','☰','فهرست مطالب']]},
];
const $slash=document.getElementById('slash');
function showSlash(){
  const r=window.getSelection().getRangeAt(0).getBoundingClientRect();
  $slash.innerHTML=SLASH_GROUPS.map(gr=>`<div class="grp">${gr.g}</div><div class="grid">${
    gr.items.map(([k,ic,l])=>`<div class="item" data-k="${k}"><span class="ic">${ic}</span>${l}</div>`).join('')}</div>`).join('');
  $slash.style.top=Math.min(r.bottom+6,innerHeight-390)+'px';
  $slash.style.left=Math.max(10,r.left-400)+'px';
  $slash.classList.add('show');
}
$editor.addEventListener('keyup',e=>{ if(e.key==='/') showSlash(); if(e.key==='Escape') $slash.classList.remove('show'); });
$slash.addEventListener('mousedown',e=>{
  const it=e.target.closest('.item'); if(!it) return; e.preventDefault();
  document.execCommand('delete');
  runBlockCommand(it.dataset.k); $slash.classList.remove('show'); scheduleSave();
});
document.addEventListener('mousedown',e=>{ if(!$slash.contains(e.target)) $slash.classList.remove('show'); });

function runBlockCommand(k){
  const ex=(c,v)=>document.execCommand(c,false,v);
  switch(k){
    case 'p': ex('formatBlock','P'); break;
    case 'h1': case 'h2': case 'h3': case 'h4': ex('formatBlock',k.toUpperCase()); break;
    case 'ul': ex('insertUnorderedList'); break;
    case 'ol': ex('insertOrderedList'); break;
    case 'quote': ex('formatBlock','BLOCKQUOTE'); break;
    case 'divider': ex('insertHTML','<hr><p><br></p>'); break;
    case 'codeblock': ex('insertHTML','<pre><code>// code</code></pre><p><br></p>'); break;
    case 'inlinecode': ex('insertHTML','<code>code</code>&nbsp;'); break;
    case 'bold': ex('bold'); break; case 'italic': ex('italic'); break;
    case 'underline': ex('underline'); break; case 'strike': ex('strikeThrough'); break;
    case 'center': ex('justifyCenter'); break; case 'right': ex('justifyRight'); break; case 'left': ex('justifyLeft'); break;
    case 'clear': ex('removeFormat'); break;
    default: runBlockCommand2(k); // ← بخش ۲
  }
}

/* ===================== 8) HELPERS + MODAL ===================== */
function escapeHtml(s){return (s||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function ask(title,val=''){
  return new Promise(res=>{
    const bg=document.getElementById('modalBg'),inp=document.getElementById('modalInput');
    document.getElementById('modalTitle').textContent=title; inp.value=val; bg.classList.add('show'); inp.focus();
    const done=v=>{bg.classList.remove('show');res(v)};
    document.getElementById('modalOk').onclick=()=>done(inp.value.trim());
    document.getElementById('modalCancel').onclick=()=>done(null);
    inp.onkeydown=e=>{if(e.key==='Enter')done(inp.value.trim()); if(e.key==='Escape')done(null)};
  });
}

/* ===================== 9) WIRING ===================== */
document.getElementById('btnTheme').onclick=()=>{state.theme=state.theme==='dark'?'light':'dark';applyTheme()};
document.getElementById('btnToggleSb').onclick=()=>document.getElementById('sidebar').classList.toggle('collapsed');
document.getElementById('btnNewFolder').onclick=async()=>{const v=await ask('نام فولدر');if(v){await createNode('folder',v,null);renderTree();}};
document.getElementById('btnNewNote').onclick=async()=>{const v=await ask('عنوان یادداشت');if(v){const n=await createNode('note',v,state.folderCtx||null);renderTree();openNote(n.id);}};
document.getElementById('btnBackup').onclick=downloadBackup;

/* =====================================================================
   ========================= بخش ۲ : JavaScript =========================
   ===================================================================== */
const ex2=(c,v)=>document.execCommand(c,false,v);
const $=id=>document.getElementById(id);

/* ---------- 10) نگهداری انتخاب (برای کارهای async مثل مودال و فایل) ---------- */
let savedRange=null;
function saveRange(){ const s=getSelection(); if(s.rangeCount && $editor.contains(s.anchorNode)) savedRange=s.getRangeAt(0).cloneRange(); }
function restoreRange(){ if(!savedRange) return; $editor.focus(); const s=getSelection(); s.removeAllRanges(); s.addRange(savedRange); }
const insertHTML=h=>{ restoreRange(); ex2('insertHTML',h); scheduleSave(); };

/* ---------- 11) پالت رنگ‌ها (P6/P8) ---------- */
const TEXT_COLORS=['','#ef4444','#f97316','#eab308','#22c55e','#3b82f6','#8b5cf6','#ec4899','#9ca3af'];
const HL_COLORS=['','#fecaca','#fed7aa','#fde68a','#bbf7d0','#bfdbfe','#e9d5ff','#fbcfe8','#e5e7eb'];
function showPalette(kind,x,y){
  saveRange();
  const list=kind==='color'?TEXT_COLORS:HL_COLORS, p=$('palette');
  p.innerHTML=list.map(c=>kind==='color'
    ?`<div class="sw" data-v="${c}" style="color:${c||'var(--text)'}">آ</div>`
    :`<div class="sw" data-v="${c}" style="background:${c||'transparent'};color:#111">${c?'':'✕'}</div>`).join('');
  p.style.left=x+'px'; p.style.top=y+'px'; p.classList.add('show');
  p.onmousedown=e=>{ const sw=e.target.closest('.sw'); if(!sw) return; e.preventDefault(); restoreRange();
    const v=sw.dataset.v;
    if(kind==='color') ex2('foreColor',v||getComputedStyle(document.body).color);
    else { ex2('styleWithCSS',true); ex2('hiliteColor',v||'transparent'); ex2('styleWithCSS',false); }
    p.classList.remove('show'); scheduleSave(); };
}

/* ---------- 12) تولبار شناور انتخاب متن (P7/P8) ---------- */
const $ftb=$('ftb');
function updateFtb(){
  const s=getSelection();
  if(!s.rangeCount||s.isCollapsed||!$editor.contains(s.anchorNode)){ $ftb.classList.remove('show'); return; }
  const r=s.getRangeAt(0).getBoundingClientRect();
  $ftb.classList.add('show');
  const w=$ftb.offsetWidth;
  $ftb.style.top=Math.max(50,r.top-46)+'px';
  $ftb.style.left=Math.min(innerWidth-w-10,Math.max(10,r.left+r.width/2-w/2))+'px';
  $ftb.querySelectorAll('[data-c]').forEach(b=>{ const c=b.dataset.c;
    b.classList.toggle('on',['bold','italic','underline'].includes(c)&&document.queryCommandState(c)||c==='strike'&&document.queryCommandState('strikeThrough')); });
}
document.addEventListener('selectionchange',()=>requestAnimationFrame(updateFtb));
$ftb.addEventListener('mousedown',e=>{
  const b=e.target.closest('button'); if(!b) return; e.preventDefault();
  const c=b.dataset.c, r=b.getBoundingClientRect();
  if(c==='colpal') return showPalette('color',r.left-60,r.top-130);
  if(c==='hlpal') return showPalette('hl',r.left-60,r.top-130);
  if(c==='ai') return; // بخش ۳: improve()
  if(c==='inlinecode'){ const t=getSelection().toString(); ex2('insertHTML',`<code>${escapeHtml(t)}</code>`); scheduleSave(); return; }
  runBlockCommand(c); scheduleSave(); updateFtb();
});
document.addEventListener('mousedown',e=>{ if(!$('palette').contains(e.target)&&!$ftb.contains(e.target)) $('palette').classList.remove('show'); });

/* ---------- 13) دستورات بلوک‌های بخش ۲ ---------- */
const filePick=$('filePick');
function pickFile(accept){
  saveRange();
  return new Promise(res=>{ filePick.accept=accept; filePick.value='';
    filePick.onchange=()=>{ const f=filePick.files[0]; if(!f) return res(null);
      const rd=new FileReader(); rd.onload=()=>res({name:f.name,size:f.size,url:rd.result}); rd.readAsDataURL(f); };
    filePick.click(); });
}
const tagColor=t=>{ let h=0; for(const ch of t) h=(h*31+ch.charCodeAt(0))%360; return `hsl(${h} 75% 60%)`; };

async function runBlockCommand2(k){
  saveRange();
  switch(k){
    case 'table':{
      const rows=+(await ask('تعداد ردیف','3'))||3, cols=+(await ask('تعداد ستون','3'))||3;
      let h='<table><thead><tr>'+Array.from({length:cols},(_,i)=>`<th>ستون ${i+1}</th>`).join('')+'</tr></thead><tbody>';
      for(let r=1;r<rows;r++) h+='<tr>'+'<td><br></td>'.repeat(cols)+'</tr>';
      insertHTML(h+'</tbody></table><p><br></p>'); break; }
    case 'check': insertHTML('<ul class="checklist"><li data-done="0"><span class="cb" contenteditable="false"></span><span class="tx">کار جدید</span></li></ul><p><br></p>'); break;
    case 'toggle': insertHTML('<details open><summary>عنوان بلوک بازشو</summary><div>محتوا اینجا...</div></details><p><br></p>'); break;
    case 'warn': insertHTML('<div class="callout warn"><span contenteditable="false">⚠️</span><div>متن هشدار</div></div><p><br></p>'); break;
    case 'info': insertHTML('<div class="callout info"><span contenteditable="false">ℹ️</span><div>متن اطلاعات</div></div><p><br></p>'); break;
    case 'mermaid': insertHTML('<div class="mm"><pre class="src">graph TD\n  A[شروع] --> B[پایان]</pre><div class="out" contenteditable="false"></div></div><p><br></p>'); setTimeout(renderSpecial,50); break;
    case 'markdown': insertHTML('<div class="mdb"><pre class="src">## عنوان\n- آیتم **ضخیم**</pre><div class="out" contenteditable="false"></div></div><p><br></p>'); setTimeout(renderSpecial,50); break;
    case 'image': { const f=await pickFile('image/*'); if(f) insertHTML(`<p><img src="${f.url}" alt="${escapeHtml(f.name)}"></p><p><br></p>`); break; }
    case 'video': { const f=await pickFile('video/*'); if(f) insertHTML(`<p><video controls src="${f.url}"></video></p><p><br></p>`); break; }
    case 'audio': { const f=await pickFile('audio/*'); if(f) insertHTML(`<p><audio controls src="${f.url}"></audio></p><p><br></p>`); break; }
    case 'file': { const f=await pickFile('*/*'); if(f) insertHTML(`<p><a class="att" contenteditable="false" download="${escapeHtml(f.name)}" href="${f.url}">📎 ${escapeHtml(f.name)} <small>(${(f.size/1024).toFixed(0)}KB)</small></a></p>`); break; }
    case 'embed': { const u=await ask('لینک یوتیوب / آپارات / ...'); if(u) insertHTML(embedHtml(u)); break; }
    case 'link': { const u=await ask('آدرس پیوند','https://'); if(u){ restoreRange(); const sel=getSelection().toString();
        sel?ex2('createLink',u):ex2('insertHTML',`<a href="${escapeHtml(u)}" target="_blank">${escapeHtml(u)}</a>`); scheduleSave(); } break; }
    case 'badge': { const t=await ask('متن بج'); if(t) insertHTML(`<span class="badge" contenteditable="false" style="color:${tagColor(t)}">● ${escapeHtml(t)}</span>&nbsp;`); break; }
    case 'mention': { const t=await ask('نام شخص'); if(t) insertHTML(`<span class="mention" contenteditable="false">@${escapeHtml(t)}</span>&nbsp;`); break; }
    case 'task': { const t=await ask('عنوان وظیفه'); if(t) insertHTML(`<span class="taskref" contenteditable="false">☑ ${escapeHtml(t)}</span>&nbsp;`); break; }
    case 'pagelink': {
      const notes=state.nodes.filter(n=>n.type==='note'&&!n.deleted);
      const i=prompt(notes.map((n,i)=>`${i+1}: ${n.name}`).join('\n')+'\n\nشماره صفحه:'); const n=notes[+i-1];
      if(n) insertHTML(`<a class="pagelink" contenteditable="false" data-id="${n.id}">📄 ${escapeHtml(n.name)}</a>&nbsp;`); break; }
    case 'emoji': { const r=savedRange?.getBoundingClientRect(); showEmoji(r?r.left:200,r?r.bottom+6:200); break; }
    case 'color': { const r=savedRange?.getBoundingClientRect(); showPalette('color',r?.left||200,(r?.bottom||200)+6); break; }
    case 'highlight': { const r=savedRange?.getBoundingClientRect(); showPalette('hl',r?.left||200,(r?.bottom||200)+6); break; }
    case 'toc': case 'import': alert('این مورد تو بخش ۳ اضافه می‌شه'); break;
  }
}
function embedHtml(u){
  let m=u.match(/(?:youtu\.be\/|v=)([\w-]{11})/);
  if(m) return `<p><iframe width="560" height="315" src="https://www.youtube.com/embed/${m[1]}" frameborder="0" allowfullscreen></iframe></p><p><br></p>`;
  m=u.match(/aparat\.com\/v\/(\w+)/);
  if(m) return `<p><iframe width="560" height="315" src="https://www.aparat.com/video/video/embed/videohash/${m[1]}/vt/frame" allowfullscreen></iframe></p><p><br></p>`;
  return `<p><iframe width="560" height="315" src="${escapeHtml(u)}"></iframe></p><p><br></p>`;
}

function convertBlock(b,k){
  const text=b.innerText.trim(), lines=text.split('\n').filter(Boolean), esc=escapeHtml;
  const map={
    p:()=>`<p>${b.innerHTML}</p>`,
    h1:()=>`<h1>${esc(text)}</h1>`, h2:()=>`<h2>${esc(text)}</h2>`, h3:()=>`<h3>${esc(text)}</h3>`, h4:()=>`<h4>${esc(text)}</h4>`,
    ul:()=>`<ul>${lines.map(l=>`<li>${esc(l)}</li>`).join('')}</ul>`,
    ol:()=>`<ol>${lines.map(l=>`<li>${esc(l)}</li>`).join('')}</ol>`,
    check:()=>`<ul class="checklist">${lines.map(l=>`<li data-done="0"><span class="cb" contenteditable="false"></span><span class="tx">${esc(l)}</span></li>`).join('')}</ul>`,
    quote:()=>`<blockquote>${esc(text)}</blockquote>`,
    code:()=>`<pre><code>${esc(text)}</code></pre>`,
    toggle:()=>`<details open><summary>${esc(lines[0]||'عنوان')}</summary><div>${esc(lines.slice(1).join(' ')||'...')}</div></details>`,
  };
  const t=document.createElement('div'); t.innerHTML=map[k](); const nb=t.firstElementChild;
  if(b.dataset.bid) nb.dataset.bid=b.dataset.bid; b.replaceWith(nb);
}

function headings(root=$editor){ return [...root.querySelectorAll('h1,h2,h3,h4')].filter(h=>!h.closest('.tocb,.mdb,.mm')&&h.textContent.trim()); }
function headTree(root){
  const hs=headings(root), top={level:0,kids:[]}, st=[top];
  hs.forEach((el,i)=>{ const lv=+el.tagName[1]; while(st[st.length-1].level>=lv) st.pop();
    const n={el,i,level:lv,text:el.textContent.trim(),kids:[]}; st[st.length-1].kids.push(n); st.push(n); });
  return {top,hs};
}
const tocClosed=new Set();
function renderTocPanel(){
  const body=$('tocBody'); if(!$('tocPanel').classList.contains('show')) return;
  const {top}=headTree();
  if(!state.activeId||!top.kids.length){ body.innerHTML='<p class="toc-empty">هنوز عنوانی نداری.<br>با H1 تا H4 فهرست خودش ساخته می‌شه.</p>'; return; }
  const rec=ns=>ns.map(n=>`<div class="toc-node${tocClosed.has(n.i)?' closed':''}" data-i="${n.i}">
    <div class="toc-item lv${n.level}" data-h="${n.i}"><span class="tc">${n.kids.length?'▾':''}</span><span class="tt" title="${escapeHtml(n.text)}">${escapeHtml(n.text)}</span></div>
    ${n.kids.length?`<div class="toc-kids">${rec(n.kids)}</div>`:''}</div>`).join('');
  body.innerHTML=rec(top.kids); markActiveHeading();
}
function scrollToHeading(i){ const h=headings()[i]; if(!h) return; h.scrollIntoView({behavior:'smooth',block:'start'}); h.classList.add('flash'); setTimeout(()=>h.classList.remove('flash'),1200); }

  if(e.target.closest('.tc')&&node.querySelector('.toc-kids')){ node.classList.toggle('closed'); node.classList.contains('closed')?tocClosed.add(i):tocClosed.delete(i); return; }
  scrollToHeading(i);
});

function toHex(c){ if(!c) return null; c=c.trim();
  if(c[0]==='#'){ let h=c.slice(1); if(h.length===3) h=[...h].map(x=>x+x).join(''); return h.slice(0,6).toUpperCase(); }

function mdInline(runs){
  return runs.map(r=>{
    if(r.img) return `![](${r.img})`;
    if(r.text==='\n') return '  \n';
    const m=r.text.match(/^(\s*)([\s\S]*?)(\s*)$/); let [_,a,t,z]=m; if(!t) return r.text;
    if(r.code) t='`'+t+'`';
    else { t=t.replace(/([*_`\\])/g,'\\$1'); if(r.b) t=`**${t}**`; if(r.i) t=`*${t}*`; if(r.s) t=`~~${t}~~`; if(r.u) t=`<u>${t}</u>`; if(r.mark) t=`<mark>${t}</mark>`; }
    if(r.href) t=`[${t}](${r.href})`;
    return a+t+z;

}
function toMarkdown(title,B){
  const out=[`# ${title}`,''];
  B.forEach((b,i)=>{ const prev=B[i-1], gap=!(prev&&prev.type==='li'&&b.type==='li');
    if(gap&&i) out.push('');
    switch(b.type){
      case 'h': out.push('#'.repeat(Math.min(6,b.level+1))+' '+mdInline(b.runs)); break;
      case 'p': out.push(mdInline(b.runs)); break;
      case 'li': out.push('  '.repeat(b.depth)+(b.check?`- [${b.done?'x':' '}] `:b.ordered?`${b.idx}. `:'- ')+mdInline(b.runs)); break;
      case 'quote': out.push(mdInline(b.runs).split('\n').map(l=>'> '+l).join('\n')); break;
      case 'callout': out.push('> '+(b.kind==='warn'?'⚠️ ':'ℹ️ ')+mdInline(b.runs.filter(r=>!/^[⚠ℹ]/.test(r.text.trim())))); break;
      case 'code': out.push('```\n'+b.text+'\n```'); break;
      case 'hr': out.push('---'); break;
      case 'img': out.push(`![](${b.src})`); break;
      case 'table': { const rows=b.rows.map(r=>'| '+r.map(c=>mdInline(c.runs).replace(/\|/g,'\\|').replace(/\n/g,' ')).join(' | ')+' |');
        rows.splice(1,0,'|'+b.rows[0].map(()=>' --- ').join('|')+'|'); out.push(rows.join('\n')); break; }
    }

}
const plain=runs=>runs.map(r=>r.img?'[تصویر]':r.text).join('');
function toText(title,B){
  const out=[title,'═'.repeat(Math.min(40,title.length+4)),''];
  B.forEach((b,i)=>{ const prev=B[i-1]; if(i&&!(prev&&prev.type==='li'&&b.type==='li')) out.push('');
    switch(b.type){
      case 'h': out.push(plain(b.runs)); if(b.level<=2) out.push('─'.repeat(Math.min(40,plain(b.runs).length))); break;
      case 'li': out.push('   '.repeat(b.depth)+(b.check?(b.done?'☑ ':'☐ '):b.ordered?fa(b.idx)+'. ':'• ')+plain(b.runs)); break;
      case 'quote': case 'callout': out.push('« '+plain(b.runs).trim()+' »'); break;

      case 'hr': out.push('────────────'); break;

      default: out.push(plain(b.runs));

  return out.join('\n').replace(/\n{3,}/g,'\n\n')+'\n';

async function toOdt(title,B){

    if(!k) return null; if(!auto.has(k)){ let p='';
      if(r.b) p+=' fo:font-weight="bold" style:font-weight-complex="bold"'; if(r.i) p+=' fo:font-style="italic" style:font-style-complex="italic"';
      if(r.u||r.href) p+=' style:text-underline-style="solid" style:text-underline-width="auto" style:text-underline-color="font-color"';
      if(r.s) p+=' style:text-line-through-style="solid"';
      if(r.code) p+=' style:font-name="Consolas" style:font-name-complex="Consolas" fo:background-color="#efeff3"';
      const col=r.href?'2563EB':(r.color&&!isLight(r.color)?r.color:null); if(col) p+=` fo:color="#${col}"`;
      if(r.mark&&!isDark(r.mark)&&!r.code) p+=` fo:background-color="#${r.mark}"`;
      auto.set(k,{name:'T'+(auto.size+1),xml:`<style:text-properties${p}/>`}); }
    return auto.get(k).name; };
  const ot=s=>xe(s).replace(/\t/g,'<text:tab/>').replace(/ {2,}/g,m=>' <text:s text:c="'+(m.length-1)+'"/>');
  const runX=async runs=>{ let x=''; for(const r of runs){
    if(r.img){ x+=await picX(r.img); continue; } if(r.text==='\n'){ x+='<text:line-break/>'; continue; }
    const s=tStyle(r), t=ot(r.text); let piece=s?`<text:span text:style-name="${s}">${t}</text:span>`:t;
    if(r.href) piece=`<text:a xlink:type="simple" xlink:href="${xe(r.href)}">${piece}</text:a>`; x+=piece; } return x; };

    const ext=(d.mime.split('/')[1]||'png').replace('jpeg','jpg').replace('svg+xml','svg'), name=`Pictures/img${pics.length+1}.${ext}`; pics.push([name,d.bytes,d.mime]);

      case 'quote': body+=`<text:p text:style-name="Quote">${await runX(b.runs)}</text:p>`; break;
      case 'callout': body+=`<text:p text:style-name="${b.kind==='warn'?'Warn':'Info'}">${await runX(b.runs)}</text:p>`; break;

      case 'hr': body+='<text:p text:style-name="Hr"/>'; break;
      case 'img': body+=`<text:p text:style-name="Center">${await picX(b.src)}</text:p>`; break;
      case 'table': { const n=Math.max(...b.rows.map(r=>r.length)); tn++;

/* ---------- 30) HTML تمیز + صفحه چاپی (برای HTML و PDF مثل PDF1) ---------- */
function cleanContent(){
  const c=$editor.cloneNode(true);
  c.querySelectorAll('[contenteditable]').forEach(e=>e.removeAttribute('contenteditable'));
  c.querySelectorAll('.mm,.mdb').forEach(b=>{ const o=b.querySelector('.out'); if(o&&o.innerHTML.trim()) b.querySelector('.src')?.remove(); else o?.remove(); });
  headings(c).forEach((h,i)=>h.id='h-'+(i+1));
  c.querySelectorAll('.tocb').forEach(t=>{ t.innerHTML=tocBlockHtml(c); t.querySelectorAll('a[data-h]').forEach(a=>a.href='#h-'+(+a.dataset.h+1)); });
  c.querySelectorAll('[style]').forEach(e=>{ const col=toHex(e.style.color); if(col&&isLight(col)) e.style.color=''; const bg=toHex(e.style.backgroundColor); if(bg&&isDark(bg)) e.style.backgroundColor=''; });
  c.querySelectorAll('font[color]').forEach(f=>{ const col=toHex(f.getAttribute('color')); if(col&&isLight(col)) f.removeAttribute('color'); });
  c.querySelectorAll('.flash').forEach(e=>e.classList.remove('flash'));
  return c.innerHTML;
}

/* ---------- 31) خروجی PDF با فونت فارسی (چاپ مرورگر = متن واقعی، قابل انتخاب و جستجو) ---------- */
async function exportPDF(title){
  const fr=document.createElement('iframe'); fr.style.cssText='position:fixed;left:-10000px;top:0;width:900px;height:1200px;border:0';
  document.body.appendChild(fr);
  await new Promise(r=>{ fr.onload=r; fr.srcdoc=docPage(title,cleanContent(),true); });
  const w=fr.contentWindow, d=fr.contentDocument;
  try{ await Promise.race([d.fonts.ready,new Promise(r=>setTimeout(r,4000))]); }catch(e){}
  await Promise.all([...d.images].map(im=>im.complete?0:new Promise(r=>{im.onload=im.onerror=r})));
  d.querySelectorAll('details').forEach(x=>x.open=true);
  const old=document.title; document.title=safeName(title);
  toast('تو پنجره چاپ، مقصد رو بذار روی <b>Save as PDF</b> 📄',6000);
  w.focus(); w.print();
  setTimeout(()=>{ document.title=old; fr.remove(); },1500);
}

async function doExport(k){
  const n=activeNote(); if(!n) return; clearTimeout(saveTimer);
  await updateNode(n.id,{name:$title.textContent.trim()||'بدون عنوان',content:$editor.innerHTML});
  const title=n.name, fn=safeName(title);
  try{
    if(k==='html') download(fn+'.html',docPage(title,cleanContent()),'text/html;charset=utf-8');
    if(k==='pdf') return exportPDF(title);
    const B=buildModel($editor);
    if(k==='md') download(fn+'.md',toMarkdown(title,B),'text/markdown;charset=utf-8');
    if(k==='txt') download(fn+'.txt','\ufeff'+toText(title,B),'text/plain;charset=utf-8');
    if(k==='docx') download(fn+'.docx',new Blob([await toDocx(title,B)],{type:'application/vnd.openxmlformats-officedocument.wordprocessingml.document'}));
    if(k==='odt') download(fn+'.odt',new Blob([await toOdt(title,B)],{type:'application/vnd.oasis.opendocument.text'}));
    toast('خروجی آماده شد ✓');
  }catch(e){ console.error(e); toast('⚠ خروجی نشد: '+e.message,5000); }

   33) وارد کردن فایل: md / txt / html / docx / پشتیبان json
   ===================================================================== */
function sanitize(html){ const d=new DOMParser().parseFromString(html,'text/html');
  d.querySelectorAll('script,style,link,meta,object,embed').forEach(x=>x.remove());
  d.querySelectorAll('*').forEach(el=>[...el.attributes].forEach(a=>{ if(/^on/i.test(a.name)||/^\s*javascript:/i.test(a.value)) el.removeAttribute(a.name); }));
  return {body:d.body.innerHTML, title:d.title||d.querySelector('h1')?.textContent||''}; }
async function fileToHtml(f){
  const ext=f.name.split('.').pop().toLowerCase(), base=f.name.replace(/\.[^.]+$/,'');
  if(ext==='md'||ext==='markdown'){ let t=await f.text(); await loadScript('https://cdn.jsdelivr.net/npm/marked/marked.min.js');
    let title=base; const m=t.match(/^#\s+(.+)\n/); if(m){ title=m[1].trim(); t=t.slice(m[0].length); }
    t=t.replace(/^(\s*)[-*] \[( |x)\] (.*)$/gmi,(_,s,x,tx)=>`${s}<ul class="checklist"><li data-done="${x.trim()?1:0}"><span class="cb" contenteditable="false"></span><span class="tx">${tx}</span></li></ul>`);
    return {title,html:sanitize(marked.parse(t)).body}; }
  if(ext==='txt'){ const t=await f.text(); return {title:base,html:t.split(/\n{2,}/).map(p=>`<p>${escapeHtml(p).replace(/\n/g,'<br>')}</p>`).join('')}; }
  if(ext==='html'||ext==='htm'){ const s=sanitize(await f.text()); return {title:s.title.trim()||base,html:s.body}; }
  if(ext==='docx'){ await loadScript('https://cdn.jsdelivr.net/npm/mammoth@1.8.0/mammoth.browser.min.js');
    const r=await mammoth.convertToHtml({arrayBuffer:await f.arrayBuffer()}); return {title:base,html:sanitize(r.value).body}; }
  throw new Error('فرمت پشتیبانی نمی‌شه: '+ext);
}
async function restoreBackup(f){
  const arr=JSON.parse(await f.text()); if(!Array.isArray(arr)) throw new Error('فایل پشتیبان معتبر نیست');
  let add=0,upd=0;
  for(const n of arr){ if(!n||!n.id||!n.type) continue; const loc=state.nodes.find(x=>x.id===n.id);
    if(!loc){ state.nodes.push(n); await dbPut('nodes',n); add++; }
    else if((n.updatedAt||0)>(loc.updatedAt||0)){ Object.assign(loc,n); await dbPut('nodes',loc); upd++; } }
  renderTree(); scheduleSync(1000);
  toast(`پشتیبان برگشت ✓ ${fa(add)} مورد جدید، ${fa(upd)} مورد بروز شد (چیزی حذف نشد)`,5000);
}
async function importFiles(files,inline=false){
  let last=null;
  for(const f of files){
    try{
      if(/\.json$/i.test(f.name)){ await restoreBackup(f); continue; }
      const {title,html}=await fileToHtml(f);
      if(inline&&state.activeId){ insertHTML(html+'<p><br></p>'); setTimeout(()=>{renderSpecial();refreshToc();},50); }
      else { const parent=state.folderCtx&&state.nodes.find(x=>x.id===state.folderCtx&&!x.deleted)?state.folderCtx:null;
        const n=await createNode('note',title||'بدون عنوان',parent); await updateNode(n.id,{content:html||'<p><br></p>'}); last=n; }
    }catch(e){ console.error(e); toast('⚠ '+f.name+': '+e.message,5000); }
  }
  if(last){ renderTree(); openNote(last.id); toast('وارد شد ✓'); }
}

const norm=s=>(s||'').replace(/ي/g,'ی').replace(/ك/g,'ک').replace(/[\u064B-\u0652\u200c\u200f\u200e]/g,'').toLowerCase();
const textCache=new Map();
function noteText(n){ const c=textCache.get(n.id); if(c&&c.u===n.updatedAt) return c.t;
  const t=new DOMParser().parseFromString(n.content||'','text/html').body.textContent.replace(/\s+/g,' ').trim(); textCache.set(n.id,{u:n.updatedAt,t}); return t; }
const pathOf=n=>{ const p=[]; let c=state.nodes.find(x=>x.id===n.parentId); while(c){ p.unshift(c.name); c=state.nodes.find(x=>x.id===c.parentId); } return p.join(' › ')||'ریشه'; };
let sResults=[], sSel=0;
function runSearch(){
  const q=norm($('searchInp').value.trim()), box=$('searchRes');
  const notes=state.nodes.filter(n=>n.type==='note'&&!n.deleted);
  if(!q){ sResults=notes.sort((a,b)=>b.updatedAt-a.updatedAt).slice(0,8).map(n=>({n,snip:''})); }
  else { const words=q.split(/\s+/);
    sResults=notes.map(n=>{ const name=norm(n.name), tags=norm((n.tags||[]).join(' ')), raw=noteText(n), body=norm(raw);
      if(!words.every(w=>name.includes(w)||body.includes(w)||tags.includes(w))) return null;
      const score=words.reduce((s,w)=>s+(name.includes(w)?10:0)+(tags.includes(w)?5:0)+(body.includes(w)?1:0),0);
      let snip=''; const i=norm(raw).indexOf(words[0]);
      if(i>=0){ const a=Math.max(0,i-40); snip=(a?'…':'')+escapeHtml(raw.slice(a,i+90))+'…'; }
      return {n,score,snip}; }).filter(Boolean).sort((a,b)=>b.score-a.score).slice(0,40);
    const rx=new RegExp('('+words.map(w=>w.replace(/[.*+?^${}()|[\]\\]/g,'\\$&')).join('|')+')','gi');
    sResults.forEach(r=>{ r.hn=escapeHtml(r.n.name).replace(rx,'<mark>$1</mark>'); r.snip=r.snip.replace(rx,'<mark>$1</mark>'); });
  }

    :'<p class="toc-empty">چیزی پیدا نشد 🤷</p>';
}

      try{ const rg=document.createRange(); rg.setStart(t,Math.min(j,t.length)); rg.setEnd(t,Math.min(j+q.length,t.length)); const s=getSelection(); s.removeAllRanges(); s.addRange(rg); }catch(e){} break; } } },60); }

   35) دکمه «✦ بهبود» : ویرایش خودکار نگارش فارسی (آفلاین، بدون هوش مصنوعی بیرونی)
   ===================================================================== */
function improveStr(s){
  return s
    .replace(/ي/g,'ی').replace(/ى(?=[\u0600-\u06FF])/g,'ی').replace(/ك/g,'ک')
    .replace(/[٠-٩]/g,d=>'۰۱۲۳۴۵۶۷۸۹'['٠١٢٣٤٥٦٧٨٩'.indexOf(d)])
    .replace(/(^|[\s\u200c(«])(ن?می) +(?=[\u0600-\u06FF]{2})/g,'$1$2\u200c')
    .replace(/([\u0600-\u06FF]) +(ها|های|هایی|هایم|هایت|هایش|هایمان|هایتان|هایشان|ترین|تری)(?=[\s.,،؛:!?؟»)]|$)/g,'$1\u200c$2')
    .replace(/ +([،؛:!؟.,»)\]])/g,'$1')
    .replace(/([،؛؟])(?=[^\s\d»)\]])/g,'$1 ')
    .replace(/([«(\[]) +/g,'$1')
    .replace(/"([^"\n]*[\u0600-\u06FF][^"\n]*)"/g,'«$1»')
    .replace(/\.{3,}/g,'…').replace(/\?/g,m=>m)
    .replace(/([\u0600-\u06FF])\?/g,'$1؟').replace(/([\u0600-\u06FF]) ?,(?!\d)/g,'$1،')
    .replace(/\u200c{2,}/g,'\u200c').replace(/ \u200c|\u200c /g,' ')
    .replace(/[ \t]{2,}/g,' ');
}
function improve(){
  const s=getSelection(); let range=null;
  if(s.rangeCount&&!s.isCollapsed&&$editor.contains(s.anchorNode)) range=s.getRangeAt(0);
  const w=document.createTreeWalker($editor,NodeFilter.SHOW_TEXT,{acceptNode:t=>
    t.parentElement.closest('pre,code,.mm,.mdb,.tocb,a')?NodeFilter.FILTER_REJECT:(range&&!range.intersectsNode(t))?NodeFilter.FILTER_SKIP:NodeFilter.FILTER_ACCEPT});
  let changed=0, t; const list=[]; while(t=w.nextNode()) list.push(t);
  for(const t of list){ const v=improveStr(t.nodeValue); if(v!==t.nodeValue){ t.nodeValue=v; changed++; } }
  if(changed){ scheduleSave(); toast(`✦ نگارش ${fa(changed)} بخش مرتب شد (ی/ک عربی، نیم‌فاصله، فاصله‌گذاری، «گیومه»)`,4000); }
  else toast('✦ متن تمیزه، چیزی برای اصلاح نبود');
}

/* =====================================================================
   38) همگام‌سازی ابری با Supabase (رایگان) — همیشه آنلاین و بروز روی همه دستگاه‌ها
   - هر تغییر چند ثانیه بعد آپلود می‌شه، هر ۳۰ ثانیه + موقع برگشتن به برنامه دریافت می‌شه
   - آفلاین کار می‌کنه و وقتی اینترنت برگشت خودش همگام می‌کنه
   - قانون: نسخه جدیدتر برنده‌ست. حذف = سطل زباله (همگام می‌شه)، حذف دائمی فقط دستی
   ===================================================================== */
const SQL_SETUP=`create table if not exists public.notes (
  id text primary key,
  user_id uuid not null default auth.uid() references auth.users on delete cascade,
  data jsonb not null,
  synced_at timestamptz not null default clock_timestamp()
);
create index if not exists notes_user_synced on public.notes (user_id, synced_at);
alter table public.notes enable row level security;
drop policy if exists "own notes" on public.notes;
create policy "own notes" on public.notes for all
  using (auth.uid() = user_id) with check (auth.uid() = user_id);
create or replace function public.notes_touch() returns trigger
language plpgsql as $$ begin new.synced_at := clock_timestamp(); return new; end $$;
drop trigger if exists notes_touch on public.notes;
create trigger notes_touch before insert or update on public.notes
  for each row execute function public.notes_touch();`;
const cfgGet=()=>JSON.parse(localStorage.getItem('mn-sync')||'null');
const cfgSet=v=>v?localStorage.setItem('mn-sync',JSON.stringify(v)):localStorage.removeItem('mn-sync');
const verGet=()=>JSON.parse(localStorage.getItem('mn-sync-ver')||'{}');
const verSet=v=>localStorage.setItem('mn-sync-ver',JSON.stringify(v));
function setSync(kind,msg){ const el=$('syncState'); el.className='sync-state '+(kind||'');
  el.textContent={ok:'☁ همگام ✓',busy:'☁ در حال همگام‌سازی…',err:'☁ خطا ✕',off:'☁ آفلاین',none:''}[kind]||''; el.title=msg||'همگام‌سازی ابری'; }
async function api(path,opt={}){
  const c=cfgGet(); await ensureToken(c);
  const r=await fetch(c.url+path,{...opt,headers:{apikey:c.key,Authorization:'Bearer '+cfgGet().access,'Content-Type':'application/json',...(opt.headers||{})}});
  if(r.status===401){ throw new Error('نشست منقضی شد، دوباره وارد شو'); }
  if(!r.ok) throw new Error((await r.text()).slice(0,200)); return r;
}
async function ensureToken(c){
  if(!c?.refresh) throw new Error('وارد نشدی');
  if(Date.now()<(c.exp||0)-60000) return;
  const r=await fetch(c.url+'/auth/v1/token?grant_type=refresh_token',{method:'POST',headers:{apikey:c.key,'Content-Type':'application/json'},body:JSON.stringify({refresh_token:c.refresh})});
  const j=await r.json(); if(!r.ok||!j.access_token){ cfgSet({...c,access:null,refresh:null}); throw new Error('نشست منقضی شد، دوباره وارد شو'); }
  cfgSet({...c,access:j.access_token,refresh:j.refresh_token,exp:Date.now()+j.expires_in*1000});
}
async function signIn(url,key,email,pass,signup){
  url=url.trim().replace(/\/+$/,''); key=key.trim();
  const r=await fetch(url+(signup?'/auth/v1/signup':'/auth/v1/token?grant_type=password'),{method:'POST',headers:{apikey:key,'Content-Type':'application/json'},body:JSON.stringify({email:email.trim(),password:pass})});
  const j=await r.json().catch(()=>({}));
  if(!r.ok) throw new Error(j.error_description||j.msg||j.message||'ورود ناموفق بود');
  if(!j.access_token) throw new Error('ثبت‌نام شد ✓ ایمیل تأیید رو باز کن، بعد «ورود» رو بزن');
  const old=cfgGet(); if(!old||old.uid!==j.user.id){ verSet({}); }
  cfgSet({url,key,email:email.trim(),uid:j.user.id,access:j.access_token,refresh:j.refresh_token,exp:Date.now()+j.expires_in*1000,lastPull:old&&old.uid===j.user.id?old.lastPull:null});
}
let syncing=false, syncT=null, pendingReload=false;
function scheduleSync(ms=4000){ if(!cfgGet()?.refresh) return; clearTimeout(syncT); syncT=setTimeout(()=>syncNow(),ms); }
window.scheduleSync=scheduleSync;
async function syncNow(manual){
  const c=cfgGet();
  if(!c?.refresh){ if(manual) openSyncModal(); return; }
  if(syncing) return; if(!navigator.onLine){ setSync('off','اینترنت وصل نیست؛ تغییرات امن روی همین دستگاه ذخیره‌ست'); return; }
  syncing=true; setSync('busy');
  try{
    /* ---- دریافت ---- */
    const ver=verGet(); let since=cfgGet().lastPull||'1970-01-01T00:00:00Z', changed=false, activeChanged=false;
    for(;;){
      const r=await api(`/rest/v1/notes?select=id,data,synced_at&synced_at=gt.${encodeURIComponent(since)}&order=synced_at.asc&limit=500`);
      const rows=await r.json();
      for(const row of rows){ since=row.synced_at; const rem=row.data, loc=state.nodes.find(n=>n.id===row.id);
        if(rem.purged){ if(loc){ await dbDel('nodes',loc.id); state.nodes=state.nodes.filter(n=>n.id!==loc.id); changed=true; if(loc.id===state.activeId) activeChanged=true; } delete ver[row.id]; continue; }
        if(!loc||(rem.updatedAt||0)>(loc.updatedAt||0)){
          if(loc){ Object.keys(loc).forEach(k=>delete loc[k]); Object.assign(loc,rem); } else state.nodes.push(rem);
          await dbPut('nodes',loc||rem); changed=true; if(rem.id===state.activeId) activeChanged=true; }
        ver[row.id]=Math.max(ver[row.id]||0,rem.updatedAt||0); }
      if(rows.length<500) break;
    }
    cfgSet({...cfgGet(),lastPull:since});
    /* ---- ارسال ---- */
    const dirty=state.nodes.filter(n=>(n.updatedAt||0)!==ver[n.id]);
    const gone=Object.keys(ver).filter(id=>!state.nodes.find(n=>n.id===id));   // حذف دائمی دستی روی این دستگاه
    const payload=[...dirty.map(n=>({id:n.id,data:n})),...gone.map(id=>({id,data:{id,purged:true,updatedAt:Date.now()}}))];
    for(let i=0;i<payload.length;i+=25){
      const chunk=payload.slice(i,i+25);
      await api('/rest/v1/notes?on_conflict=id',{method:'POST',headers:{Prefer:'resolution=merge-duplicates,return=minimal'},body:JSON.stringify(chunk)});
      chunk.forEach(p=>{ if(p.data.purged) delete ver[p.id]; else ver[p.id]=p.data.updatedAt||0; });
    }
    verSet(ver);
    if(changed){ renderTree();
      if(activeChanged){ const focused=$editor.contains(document.activeElement)||$title.contains(document.activeElement);
        if(focused) pendingReload=true; else openNote(state.nodes.find(n=>n.id===state.activeId&&!n.deleted)?state.activeId:null); } }
    const t=new Date(); setSync('ok','آخرین همگام‌سازی: '+fa(pad(t.getHours())+':'+pad(t.getMinutes())));
    if(manual) toast('☁ همگام شد ✓');
  }catch(e){ console.error(e); setSync('err',e.message); if(manual) toast('☁ '+e.message,5000); }
  finally{ syncing=false; }
}
window.syncNow=syncNow;
$editor.addEventListener('focusout',()=>{ if(pendingReload){ pendingReload=false; setTimeout(()=>{ if(!$editor.contains(document.activeElement)) openNote(state.activeId); },300); } });
/* هر تغییر محلی → همگام‌سازی چند ثانیه بعد */
const _upd=updateNode; updateNode=async function(id,patch){ await _upd(id,patch); scheduleSync(); };
const _crt=createNode; createNode=async function(...a){ const n=await _crt(...a); scheduleSync(); return n; };

/* =====================================================================
   41) پوشهٔ دفتر (مثل Obsidian): هر یادداشت = یک فایل .md، هر فولدر = یک پوشهٔ واقعی
   - برنامه مرجع اصلیه؛ پوشه یک آینهٔ دوطرفه‌ست (File System Access API، فقط Chrome/Edge دسکتاپ)
   - هیچ فایلی حذف نمی‌شه: فایل‌های جایگزین‌شده/جابه‌جاشده می‌رن تو پوشهٔ «.دفتر-سطل»
   - اگه یه یادداشت هم تو برنامه هم تو پوشه تغییر کنه، هر دو نسخه نگه داشته می‌شن
   ===================================================================== */
const VAULT={h:null,map:{},busy:false};
const fsOk=!!window.showDirectoryPicker;
const h53=s=>{let a=0xdeadbeef,b=0x41c6ce57;for(let i=0;i<s.length;i++){const c=s.charCodeAt(i);a=Math.imul(a^c,2654435761);b=Math.imul(b^c,1597334677)}a=Math.imul(a^a>>>16,2246822507)^Math.imul(b^b>>>13,3266489909);b=Math.imul(b^b>>>16,2246822507)^Math.imul(a^a>>>13,3266489909);return (4294967296*(2097151&b)+(a>>>0)).toString(36)};
const vName=s=>(s||'بدون عنوان').replace(/[\\/:*?"<>|#^\[\]]/g,'-').replace(/\s+/g,' ').trim().slice(0,80)||'بدون عنوان';
const fmRe=/^---\r?\nmn-id: *([^\r\n]+)\r?\n---\r?\n/;
const vSave=()=>dbPut('meta',{key:'vault',handle:VAULT.h,map:VAULT.map});
async function vPerm(ask){ if(!VAULT.h) return false; const o={mode:'readwrite'};
  if(await VAULT.h.queryPermission(o)==='granted') return true;
  return !!ask && await VAULT.h.requestPermission(o)==='granted'; }
function vUi(s){ const b=$('btnVault'); if(!b) return;
  b.textContent=!fsOk?'📂 پوشه (Chrome/Edge)':!VAULT.h?'📂 پوشهٔ دفتر':s==='busy'?'📂 …':s==='perm'?'📂 ⚠ اتصال دوباره':'📂 پوشه ✓';
  b.title=VAULT.h?`پوشهٔ متصل: ${VAULT.h.name} — کلیک: همگام‌سازی، راست‌کلیک: قطع اتصال`:'اتصال به یک پوشهٔ واقعی روی کامپیوتر (مثل Obsidian)'; }
async function vDir(root,parts,create){ let d=root; for(const s of parts) d=await d.getDirectoryHandle(s,{create}); return d; }
async function vWrite(path,text){ const p=path.split('/'),f=p.pop(), d=await vDir(VAULT.h,p,true), fh=await d.getFileHandle(f,{create:true});
  const w=await fh.createWritable(); await w.write(text); await w.close(); return (await fh.getFile()).lastModified; }
async function vRead(path){ try{ const p=path.split('/'),f=p.pop(), d=await vDir(VAULT.h,p,false); return await (await (await d.getFileHandle(f)).getFile()).text(); }catch(e){ return null; } }
async function vArchive(path){ const t=await vRead(path); if(t==null) return;
  const st=new Date().toISOString().slice(0,19).replace(/[:T]/g,'-')+'_'+h53(t).slice(0,4);
  await vWrite('.دفتر-سطل/'+st+'__'+path.replace(/\//g,'__'),t);
  const p=path.split('/'),f=p.pop(); await (await vDir(VAULT.h,p,false)).removeEntry(f); }
async function vScan(dir,pre,out){ for await(const [name,h] of dir.entries()){ if(name.startsWith('.')) continue;
  if(h.kind==='directory') await vScan(h,pre+name+'/',out); else if(/\.md$/i.test(name)) out.push({path:pre+name,h}); } return out; }
const vFolderPath=n=>{ const seg=[]; let c=n; while(c){ seg.unshift(vName(c.name)); c=state.nodes.find(x=>x.id===c.parentId); } return seg; };
function vPaths(){ const used=new Set(),P={};
  state.nodes.filter(n=>n.type==='note'&&!n.deleted).sort((a,b)=>(a.createdAt||0)-(b.createdAt||0)).forEach(n=>{
    const d=vFolderPath(state.nodes.find(x=>x.id===n.parentId)||null).filter(Boolean); let p=[...d,vName(n.name)+'.md'].join('/');
    if(used.has(p.toLowerCase())) p=[...d,vName(n.name)+' ('+n.id.slice(-4)+').md'].join('/');
    used.add(p.toLowerCase()); P[n.id]=p; });
  return P; }
function vText(n){ const d=document.createElement('div'); d.innerHTML=n.content||''; return '---\nmn-id: '+n.id+'\n---\n'+toMarkdown(n.name,buildModel(d)); }
async function vFolderFor(parts){ let pid=null; for(const s of parts){
  let f=state.nodes.find(n=>n.type==='folder'&&!n.deleted&&n.parentId===pid&&vName(n.name)===s); if(!f) f=await createNode('folder',s,pid); pid=f.id; } return pid; }
const vImport=(text,name)=>fileToHtml({name:name+'.md',text:async()=>text.replace(fmRe,'')});
function vDirty(){ const P=vPaths(); return state.nodes.some(n=>n.type==='note'&&(n.deleted?!!VAULT.map[n.id]:(!VAULT.map[n.id]||VAULT.map[n.id].updatedAt<n.updatedAt||VAULT.map[n.id].path!==P[n.id]))); }

async function vaultSync(manual){
  if(!VAULT.h||VAULT.busy) return;
  if(!await vPerm(false)){ vUi('perm'); if(manual) toast('برای اتصال دوباره روی «📂 اتصال دوباره» بزن'); return; }
  VAULT.busy=true; vUi('busy'); let imp=0,out=0;
  try{
    await flushSave();
    const files=await vScan(VAULT.h,'',[]), seen=new Set(), byPath={};
    for(const [i,r] of Object.entries(VAULT.map)) byPath[r.path]=i;
    /* ۱) پوشه → برنامه */
    for(const f of files){
      const file=await f.h.getFile(), rid=byPath[f.path];
      if(rid&&VAULT.map[rid].mtime===file.lastModified&&state.nodes.some(x=>x.id===rid)){ seen.add(rid); continue; }
      const text=await file.text(), m=text.match(fmRe), id=m&&m[1].trim(), hash=h53(text);
      const node=id&&state.nodes.find(x=>x.id===id), rec=id&&VAULT.map[id];
      const parts=f.path.split('/'), fname=parts.pop().replace(/\.md$/i,'');
      if(node&&rec){
        seen.add(id);
        if(f.path!==rec.path){ const pid=await vFolderFor(parts); await updateNode(id,{parentId:pid,name:fname.replace(/ \([0-9a-z]{4}\)$/,'')}); rec.path=f.path; rec.updatedAt=node.updatedAt; imp++; }
        if(rec.hash===hash){ rec.mtime=file.lastModified; continue; }
        const {title,html}=await vImport(text,fname);
        if(node.updatedAt>rec.updatedAt){             // هر دو طرف تغییر کرده → هر دو نسخه می‌مونن
          const c=await createNode('note',(title||fname)+' (نسخهٔ پوشه)',node.parentId); await updateNode(c.id,{content:html||'<p><br></p>'});
          await vArchive(f.path); seen.delete(id);
        }else{
          await makeBackup(); await updateNode(id,{name:title||fname,content:html||'<p><br></p>'});
          const nn=state.nodes.find(x=>x.id===id); VAULT.map[id]={path:f.path,hash,updatedAt:nn.updatedAt,mtime:file.lastModified};
        }
        imp++;
      }else if(node&&!rec){ await vArchive(f.path); }       // فایلِ هم‌شناسه ولی ناشناس برای این اتصال: اول کپی ایمن
      else{                                                  // فایل جدید (Obsidian یا دستگاه دیگر)
        const {title,html}=await vImport(text,fname), pid=await vFolderFor(parts);
        const c=await createNode('note',title||fname,pid); await updateNode(c.id,{content:html||'<p><br></p>'});
        await vArchive(f.path); imp++;
      }
    }
    /* ۲) برنامه → پوشه */
    for(const fo of state.nodes.filter(x=>x.type==='folder'&&!x.deleted)) await vDir(VAULT.h,vFolderPath(fo),true);
    const P=vPaths();
    for(const n of state.nodes.filter(x=>x.type==='note')){
      const rec=VAULT.map[n.id];
      if(n.deleted){ if(rec){ await vArchive(rec.path); delete VAULT.map[n.id]; out++; } continue; }
      const path=P[n.id];
      if(rec&&rec.path===path&&rec.updatedAt>=n.updatedAt&&seen.has(n.id)) continue;
      if(rec&&rec.path!==path){ const cur=await vRead(rec.path); if(cur!=null&&h53(cur)===rec.hash) await vArchive(rec.path); }
      const t=vText(n), mt=await vWrite(path,t);
      VAULT.map[n.id]={path,hash:h53(t),updatedAt:n.updatedAt,mtime:mt}; out++;
    }
    await vSave();
    if(imp){ renderTree(); if(state.activeId) openNote(state.activeId); }
    vUi('ok'); if(manual||imp) toast(`پوشه همگام شد ✓ ${fa(imp)} مورد از پوشه، ${fa(out)} مورد به پوشه`,4000);
  }catch(e){ console.error(e); vUi('ok'); toast('⚠ همگام‌سازی پوشه: '+e.message,6000); }
  finally{ VAULT.busy=false; }
}
async function vInit(){
  vUi();
  if(!fsOk) return;
  const m=await dbGet('meta','vault');
  if(m&&m.handle){ VAULT.h=m.handle; VAULT.map=m.map||{}; vUi(); if(await vPerm(false)) vaultSync(); else vUi('perm'); }
  setInterval(()=>{ if(VAULT.h&&!VAULT.busy&&!document.hidden&&vDirty()) vaultSync(); },6000);
  setInterval(()=>{ if(VAULT.h&&!VAULT.busy&&!document.hidden) vaultSync(); },45000);
  addEventListener('focus',()=>{ if(VAULT.h) vaultSync(); });
}
$('btnVault').onclick=async()=>{
  if(!fsOk) return toast('این قابلیت فقط در Chrome یا Edge دسکتاپ کار می‌کند');
  try{
    if(!VAULT.h){ VAULT.h=await showDirectoryPicker({id:'mehran-vault',mode:'readwrite'}); VAULT.map={}; await vSave(); toast('پوشه وصل شد؛ در حال همگام‌سازی…'); }
    else if(!await vPerm(true)) return toast('اجازهٔ دسترسی به پوشه داده نشد');
    await vaultSync(true);
  }catch(e){ if(e.name!=='AbortError'){ console.error(e); toast('⚠ '+e.message,5000); } vUi(); }
};
$('btnVault').oncontextmenu=async e=>{ e.preventDefault();
  if(VAULT.h&&confirm('اتصال با پوشهٔ «'+VAULT.h.name+'» قطع شود؟ هیچ فایل یا یادداشتی حذف نمی‌شود.')){ VAULT.h=null; VAULT.map={}; await dbDel('meta','vault'); vUi(); } };
